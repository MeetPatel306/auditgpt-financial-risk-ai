services:
  - type: web
    name: auditgpt-backend
    runtime: python
    runtimeVersion: 3.11.9
    buildCommand: pip install --upgrade pip setuptools wheel --no-cache-dir && pip install --only-binary :all: --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
